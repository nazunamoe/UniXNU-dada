# uses. Replace it with the published pin once that repository is available.
[soc]
name = "sm8750"
description = "Qualcomm SM8750 resources (from the OnePlus 13T PKX110 observations), reduced for the Xiaomi 15 (dada)"
source = "https://github.com/IssacL04/UniXNU-sm8750-common"
revision = "feaa135df4763e3c19a155402e6b17b124a12e13"

# Sm8750Platform (the 13T's GCC/SMMU/SPMI/DSI kit) is not in the official UniXNU catalog and no dada component uses it.
